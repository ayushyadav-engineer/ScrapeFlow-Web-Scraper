name: security

on:
  push:
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -v
      - run: pip-audit -r requirements.txt --strict --progress-spinner off
      - run: python tools/scan_secrets.py
      - run: python tools/scan_uploads.py
