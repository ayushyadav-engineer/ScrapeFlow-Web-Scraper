{% extends "base.html" %}
{% block title %}Register · ScrapeFlow{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="glass-card auth-card">
    <p class="eyebrow">CREATE ACCOUNT</p>
    <h1>Start scraping securely</h1>
    <p class="muted">Use a strong password with 12–128 characters.</p>
    <form method="post" class="form-stack" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email<input type="email" name="email" maxlength="320" autocomplete="email" required></label>
      <label>Password<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <label>Confirm Password<input type="password" name="confirm_password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <button class="primary-button" type="submit">Create Account</button>
    </form>
    <p class="muted small">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div>
</section>
{% endblock %}
