{% extends "base.html" %}
{% block title %}Sign in · ScrapeFlow{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="glass-card auth-card">
    <p class="eyebrow">SECURE ACCESS</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to continue to your scraping workspace.</p>
    <form method="post" class="form-stack" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email<input type="email" name="email" maxlength="320" autocomplete="email" required></label>
      <label>Password<input type="password" name="password" maxlength="128" autocomplete="current-password" required></label>
      <button class="primary-button" type="submit">Sign in</button>
    </form>
    <p class="muted small">New here? <a href="{{ url_for('auth.register_page') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
